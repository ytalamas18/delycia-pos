# Botón manual (Actions → Setup agente → Run workflow): corre infra/scripts/setup-agente.sh en la EC2 por SSM.
# Usa el mismo rol OIDC que el deploy (solo desde main). Idempotente: se puede correr varias veces.
name: Setup agente

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: sa-east-1

      - name: Correr setup-agente.sh en la EC2 (SSM Run Command)
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          CMD="bash /opt/delycia/infra/scripts/setup-agente.sh"
          ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript \
            --comment "setup agente" --timeout-seconds 600 \
            --parameters "$(jq -nc --arg c "$CMD" '{commands:[$c], executionTimeout:["600"]}')" \
            --query Command.CommandId --output text)
          echo "Comando SSM: $ID"
          while :; do
            sleep 10
            STATUS=$(aws ssm get-command-invocation --command-id "$ID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            echo "  $STATUS"
            case "$STATUS" in Pending|InProgress|Delayed) ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$ID" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text | tail -60
          [ "$STATUS" = Success ]
