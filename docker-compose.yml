# Entorno local completo: base de datos + migraciones/seed + app.
#   docker compose up --build
# La app queda en http://localhost:3000 (y en http://<IP-de-tu-PC>:3000 desde la red local).

services:
  db:
    image: postgres:16-alpine
    # Si se reinicia la PC del local, vuelve a levantar solo (con Docker Desktop iniciado con Windows).
    restart: unless-stopped
    environment:
      POSTGRES_USER: delycia
      # Valor de desarrollo; en producción definir POSTGRES_PASSWORD en .env
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-delycia}
      POSTGRES_DB: delycia
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delycia -d delycia"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Corre una vez: aplica migraciones y carga los datos de ejemplo (el seed es idempotente).
  migrate:
    build:
      context: .
      target: build
    environment:
      DATABASE_URL: postgresql://delycia:${POSTGRES_PASSWORD:-delycia}@db:5432/delycia?schema=public
      # PIN iniciales (solo al crear usuarios); si faltan, el seed los genera y los imprime en este log.
      ADMIN_PIN: ${ADMIN_PIN:-}
      CAJA_PIN: ${CAJA_PIN:-}
      COCINA_PIN: ${COCINA_PIN:-}
    command: sh -c "npx prisma migrate deploy && npx prisma db seed"
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://delycia:${POSTGRES_PASSWORD:-delycia}@db:5432/delycia?schema=public
      # Valor de respaldo SOLO para desarrollo: en el local / producción definir SESSION_SECRET en .env
      SESSION_SECRET: ${SESSION_SECRET:-solo-para-desarrollo-cambiar-en-produccion}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
